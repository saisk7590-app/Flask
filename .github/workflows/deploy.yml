name: Flask API CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install -r phase_7_deployment/day5_cicd/requirements.txt

      - name: Run tests
        working-directory: phase_7_deployment/day5_cicd
        run: python -m pytest

      - name: Show project files
        run: ls phase_7_deployment/day5_cicd